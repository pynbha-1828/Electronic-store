<!DOCTYPE html>
<html>
<head>

    <title>Cart</title>

    <style>

        body{
            font-family:Arial;
            margin:0;
            background:#f2f2f2;
        }

        .navbar{
            background:black;
            color:white;
            padding:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-left:20px;
        }

        #cart{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
            margin-top:20px;
        }

        .card{
            background:white;
            width:220px;
            padding:15px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .card img{
            width:180px;
            height:180px;
            object-fit:cover;
        }

        button{
            padding:10px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }

    </style>

</head>
<body>

<div class="navbar">

    <h2>My Cart</h2>

    <div>

        <a href="home.html">Home</a>

        <a href="cart.html">Cart</a>

    </div>

</div>

<div id="cart"></div>

<script>

async function loadCart(){

    const user_id = localStorage.getItem("user_id");

    const res = await fetch(`/cartitems/${user_id}`);

    const data = await res.json();

    let output = "";

    data.forEach(item => {

        output += `

        <div class="card">

            <img src="${item.image}">

            <h2>${item.product_name}</h2>

            <p>₹${item.price}</p>

            <button onclick="orderNow('${item.product_name}','${item.price}','${item.image}')">
                Order
            </button>

        </div>

        `;

    });

    document.getElementById("cart").innerHTML = output;

}

async function orderNow(name,price,image){

    const user_id = localStorage.getItem("user_id");

    const res = await fetch("/order",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body: JSON.stringify({
            user_id,
            product_name:name,
            price:price,
            image:image
        })

    });

    const data = await res.text();

    alert(data);

}

loadCart();

</script>

</body>
</html>
