<!DOCTYPE html>
<html>
<head>

    <title>Orders</title>

    <style>

        body{
            font-family:Arial;
            margin:0;
            background:#f2f2f2;
        }

        .navbar{
            background:black;
            color:white;
            padding:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-left:20px;
        }

        #orders{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
            margin-top:20px;
        }

        .card{
            background:white;
            width:220px;
            padding:15px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .card img{
            width:180px;
            height:180px;
            object-fit:cover;
        }

    </style>

</head>
<body>

<div class="navbar">

    <h2>My Orders</h2>

    <div>

        <a href="home.html">Home</a>

        <a href="cart.html">Cart</a>

        <a href="orders.html">Orders</a>

    </div>

</div>

<div id="orders"></div>

<script>

async function loadOrders(){

    const user_id = localStorage.getItem("user_id");

    const res = await fetch(`/orders/${user_id}`);

    const data = await res.json();

    let output = "";

    data.forEach(item => {

        output += `

        <div class="card">

            <img src="${item.image}">

            <h2>${item.product_name}</h2>

            <p>₹${item.price}</p>

        </div>

        `;

    });

    document.getElementById("orders").innerHTML = output;

}

loadOrders();

</script>

</body>
</html>
